<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Buxoro shriftlari.
     Inter 4 paketga qarab "Inter" (statik) yoki "Inter Variable" (o'zgaruvchan) nomi bilan
     o'rnatiladi. Quyidagi taxalluslar tufayli konfiguratsiyalardagi "Inter" va
     "Inter Display" har ikki holatda ham topiladi. -->
<fontconfig>
  <alias binding="same"><family>Inter</family><accept><family>Inter Variable</family></accept></alias>
  <alias binding="same"><family>Inter Variable</family><accept><family>Inter</family></accept></alias>
  <alias binding="same"><family>Inter Display</family><accept><family>Inter Variable</family><family>Inter</family></accept></alias>

  <!-- Terminal shrifti: Nerd Font yo'q bo'lsa ham albatta MONOSPACE shrift qaytsin.
       Aks holda fontconfig oddiy Inter ni beradi va terminalda harflar ustma-ust tushadi.
       "strong" bog'lanish tizimning sans-serif zaxirasidan ustun turadi. -->
  <match target="pattern">
    <test name="family" qual="any" compare="contains"><string>Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrainsMono Nerd Font Mono</string>
      <string>JetBrains Mono</string>
      <string>DejaVu Sans Mono</string>
      <string>Noto Sans Mono</string>
      <string>Liberation Mono</string>
    </edit>
  </match>

  <alias><family>sans-serif</family><prefer><family>Inter</family><family>Inter Variable</family><family>Noto Sans</family><family>DejaVu Sans</family><family>Noto Color Emoji</family><family>Symbols Nerd Font</family></prefer></alias>
  <alias><family>serif</family><prefer><family>Noto Serif</family><family>DejaVu Serif</family><family>Noto Color Emoji</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>JetBrainsMono Nerd Font</family><family>JetBrainsMono Nerd Font Mono</family><family>DejaVu Sans Mono</family><family>Noto Sans Mono</family><family>Noto Color Emoji</family><family>Symbols Nerd Font Mono</family></prefer></alias>
  <alias><family>emoji</family><prefer><family>Noto Color Emoji</family></prefer></alias>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
