# mpv — apparat dekodlash, yuqori sifat
vo=gpu-next
hwdec=auto-safe
profile=high-quality
keep-open=yes
save-position-on-quit=yes
autofit-larger=85%x85%
cursor-autohide=1000
volume=80
volume-max=150
sub-auto=fuzzy
sub-font="Inter"
sub-font-size=40
slang=uz,ru,en
alang=uz,ru,en
screenshot-directory=~/Pictures/Screenshots
screenshot-template="mpv-%F-%P"
osd-font="Inter"
osd-bar-h=2
