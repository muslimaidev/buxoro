# foot — eng tez Wayland terminali. Server rejimida ishlaydi (footclient).
include=~/.config/foot/colors.ini

[main]
shell=zsh
term=xterm-256color
# Zaxira zanjiri: Nerd Font yo'q bo'lsa ham matn har doim ko'rinadi (DejaVu/Noto),
# ikonkalar Symbols Nerd Font dan, emoji Noto Color Emoji dan olinadi.
# Shrift va uning o'lchami colors.ini da (bx-theme yaratadi). O'lchamni o'zgartirish: bx-fonts size 15
# line-height va letter-spacing ataylab yo'q: foot ularni PUNKTLARDA oladi
# (1.15 = 1.15 pt, ya'ni ~1.5 piksel qator!). Shrift o'z o'lchamidan foydalanadi.
pad=14x12 center
dpi-aware=no
selection-target=both
resize-delay-ms=50

[environment]
COLORTERM=truecolor

[bell]
urgent=yes
notify=no
visual=no

[scrollback]
lines=10000
multiplier=3.0

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh

[cursor]
style=beam
blink=yes
beam-thickness=1.6

[mouse]
hide-when-typing=yes

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
search-start=Control+Shift+f
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
font-reset=Control+0 Control+KP_0
spawn-terminal=Control+Shift+n
show-urls-launch=Control+Shift+o
