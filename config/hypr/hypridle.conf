# hypridle — harakatsizlikda nima bo'lishi
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# 2.5 daqiqa: ekranni xiralashtirish
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# Klaviatura yorug'ligini o'chirish (bo'lmasa, e'tiborsiz qoladi)
listener {
    timeout = 150
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

# 5 daqiqa: qulflash
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 daqiqa: ekranni o'chirish
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# 30 daqiqa: uyqu rejimi
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
